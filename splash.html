<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>MuxMelt</title>
  <style>
    :root {
      color-scheme: dark;
      font: 13px "Segoe UI", Arial, sans-serif;
      --background: #202020; --border: #404040; --text: #f0f0f0; --muted: #b8b8b8; --accent: #60cdff;
      background: var(--background); color: var(--text);
    }
    @media (prefers-color-scheme: light) {
      :root { color-scheme: light; --background: #fff; --border: #d6d6d6; --text: #202020; --muted: #616161; --accent: #0067c0; }
    }
    * { box-sizing: border-box; }
    body { height: 100vh; width: 100vw; margin: 0; overflow: hidden; user-select: none; -webkit-app-region: drag; }
    .stage { width: 100%; height: 100%; padding: 36px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
    h1 { font-size: 20px; font-weight: 600; line-height: 1.3; margin: 0; }
    .status { display: grid; gap: 6px; }
    #statusText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #detailText { color: var(--muted); font-size: 12px; min-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .progress { background: var(--border); height: 4px; border-radius: 2px; overflow: hidden; margin-top: 12px; }
    .progress-fill { background: var(--accent); height: 100%; width: 8%; }
  </style>
</head>
<body>
  <main class="stage" aria-label="MuxMelt loading">
    <header class="brand">
      <h1>MuxMelt</h1>
    </header>

    <section class="status" aria-live="polite">
      <div id="statusText">Preparing MuxMelt</div>
      <div id="detailText">Loading required components</div>
      <div class="progress" id="progressBar" role="progressbar" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>
  </main>

  <script>
    const statusText = document.getElementById('statusText');
    const detailText = document.getElementById('detailText');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    let displayedPercent = 8;

    window.setSplashProgress = ({ percent, status, detail }) => {
      const value = Math.round(Math.max(0, Math.min(100, Number(percent) || 0)));
      const nextDetail = detail || 'Loading required components';
      if (status && statusText.textContent !== status) statusText.textContent = status;
      if (detailText.textContent !== nextDetail) detailText.textContent = nextDetail;
      if (value !== displayedPercent) {
        displayedPercent = value;
        progressFill.style.width = value + '%';
        progressBar.setAttribute('aria-valuenow', String(value));
      }
    };

    window.playSplashFinish = () => {
      window.setSplashProgress({ percent: 100, status: 'Ready', detail: 'Opening MuxMelt' });
      return Promise.resolve();
    };
  </script>
</body>
</html>
