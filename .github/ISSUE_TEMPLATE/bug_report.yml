name: Bug report
description: Report a reproducible MuxMelt problem without sharing private media or credentials.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MuxMelt. Do not attach private media, browser cookies, passwords, tokens, or full local paths.
  - type: input
    id: version
    attributes:
      label: MuxMelt version
      placeholder: "For example: 1.2.11"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other source build
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Affected tool
      placeholder: "For example: Video Compressor"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use generic filenames and remove personal information.
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste only scrubbed log lines; remove usernames and paths.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private files, credentials, cookies, tokens, usernames, and full local paths.
          required: true
