<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>MuxMelt - Component Setup</title>
  <style>
    :root {
      color-scheme: dark;
      font: 13px "Segoe UI", Arial, sans-serif;
      --background: #202020; --surface: #282828; --border: #404040;
      --text: #f0f0f0; --muted: #b8b8b8; --accent: #60cdff; --accent-text: #202020; --error: #ffb4ab;
      background: var(--background); color: var(--text);
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --background: #fff; --surface: #f5f5f5; --border: #d6d6d6;
        --text: #202020; --muted: #616161; --accent: #0067c0; --accent-text: #fff; --error: #b42318;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; user-select: none; }
    .setup-window { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .setup-header {
      display: flex; align-items: center; flex: 0 0 32px; padding: 0 18px;
      background: var(--surface); border-bottom: 1px solid var(--border); -webkit-app-region: drag;
    }
    .setup-header strong { font-size: 12px; font-weight: 400; }
    .setup-content { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 22px; overflow-y: auto; }
    .setup-content > * { flex-shrink: 0; }
    h1 { font-size: 18px; font-weight: 600; line-height: 1.3; margin: 0; }
    .subtitle { color: var(--muted); line-height: 1.5; margin: 8px 0 22px; }
    .progress-bar { background: var(--border); height: 4px; border-radius: 2px; overflow: hidden; width: 100%; }
    .progress-fill { background: var(--accent); height: 100%; width: 0%; }
    .status { margin-top: 12px; min-height: 18px; }
    .detail { color: var(--muted); font-size: 12px; margin-top: 5px; min-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .error { color: var(--error); display: none; font-size: 12px; line-height: 1.5; margin-top: 12px; }
    .setup-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: auto; padding-top: 22px; min-height: 54px; -webkit-app-region: no-drag; }
    button { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; color: var(--text); cursor: pointer; display: none; font: inherit; min-width: 80px; min-height: 32px; padding: 5px 16px; }
    button:hover:not(:disabled) { border-color: var(--muted); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: .48; cursor: not-allowed; }
    .retry-btn { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .cancel-btn { display: inline-block; }
  </style>
</head>
<body>
  <main class="setup-window">
    <header class="setup-header">
      <strong>MuxMelt Setup</strong>
    </header>

    <section class="setup-content">
      <h1>Install media pack</h1>
      <p class="subtitle">Required files are installed once and kept on this computer.</p>

      <div class="progress-area">
        <div class="progress-bar" id="progressBar" role="progressbar" aria-label="Media pack installation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">Preparing...</div>
        <div class="detail" id="detail"></div>
      </div>

      <div class="error" id="error" role="alert"></div>
      <div class="setup-actions">
        <button class="retry-btn" id="retryBtn">Retry</button>
        <button class="cancel-btn" id="cancelBtn">Cancel</button>
        <button class="quit-btn" id="quitBtn">Quit</button>
      </div>
    </section>
  </main>

  <script>
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('status');
    const detailText = document.getElementById('detail');
    const errorText = document.getElementById('error');
    const retryButton = document.getElementById('retryBtn');
    const cancelButton = document.getElementById('cancelBtn');
    const quitButton = document.getElementById('quitBtn');
    let displayedPercent = 0;

    function setText(element, value) {
      if (element.textContent !== value) element.textContent = value;
    }

    function setProgress(value) {
      const percent = Math.round(Math.max(0, Math.min(100, Number(value) || 0)));
      if (percent === displayedPercent) return;
      displayedPercent = percent;
      progressFill.style.width = percent + '%';
      progressBar.setAttribute('aria-valuenow', String(percent));
    }

    window.setup.onProgress((data) => {
      setProgress(data.percent);
      setText(statusText, data.status || '');
      setText(detailText, data.detail || '');
    });

    window.setup.onError((msg) => {
      errorText.style.display = 'block';
      setText(errorText, msg);
      retryButton.style.display = 'inline-block';
      cancelButton.style.display = 'none';
      quitButton.style.display = 'inline-block';
    });

    window.setup.onComplete(() => {
      setText(statusText, 'Setup complete. Starting MuxMelt...');
      setProgress(100);
      cancelButton.style.display = 'none';
    });

    retryButton.addEventListener('click', () => {
      errorText.style.display = 'none';
      retryButton.style.display = 'none';
      cancelButton.style.display = 'inline-block';
      cancelButton.disabled = false;
      quitButton.style.display = 'none';
      setText(statusText, 'Retrying...');
      setText(detailText, '');
      setProgress(0);
      window.setup.requestRetry();
    });

    quitButton.addEventListener('click', () => {
      window.setup.requestCancel();
    });

    cancelButton.addEventListener('click', () => {
      cancelButton.disabled = true;
      setText(statusText, 'Cancelling safely...');
      window.setup.requestCancel();
    });
  </script>
</body>
</html>
