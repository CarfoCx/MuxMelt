<!-- Tool body -->
<div class="tool-body">
  <header class="tool-intro">
    <h2>Make a GIF</h2>
    <p>Turn a moment from a video into a GIF. Choose your clip, adjust the size, and create.</p>
  </header>

  <!-- Drop zone -->
  <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-describedby="gifDropHint">
    <div class="drop-zone-icon">&#127916;</div>
    <div class="drop-zone-text">
      Drop one video here
    </div>
    <div class="drop-zone-actions">
      <button type="button" class="drop-zone-link" id="browseBtn">Choose video</button>
    </div>
    <div class="drop-zone-hint" id="gifDropHint">
      Supported files: MP4, AVI, MKV, MOV, WebM
    </div>
  </div>

  <!-- Video info -->
  <div class="gif-video-info" id="videoInfo" style="display: none;">
    <span class="gif-video-name" id="videoName"></span>
    <button type="button" class="file-remove" id="removeVideoBtn" title="Remove" aria-label="Remove selected video">&times;</button>
  </div>

  <!-- Settings -->
  <div class="settings-bar" style="flex-wrap: wrap;">
    <div class="setting-group">
      <label for="fpsSlider" title="More frames per second creates smoother motion and larger files">Frames per second</label>
      <input type="range" id="fpsSlider" min="5" max="30" value="15">
      <span class="range-value" id="fpsValue">15</span>
    </div>

    <div class="setting-group">
      <label for="widthInput">Width (px):</label>
      <input type="number" id="widthInput" placeholder="480" value="480" min="50" max="2000" style="width: 80px;">
    </div>

    <div class="setting-group">
      <label for="startTime">Start time</label>
      <input type="text" id="startTime" placeholder="00:00:00" value="00:00:00" title="Hours:minutes:seconds" style="width: 90px;">
    </div>

    <div class="setting-group">
      <label for="endTime">End time</label>
      <input type="text" id="endTime" placeholder="00:00:05" value="00:00:05" title="Hours:minutes:seconds" style="width: 90px;">
    </div>

    <div class="setting-group">
      <label for="duration">Duration (seconds)</label>
      <input type="number" id="duration" placeholder="5" value="5" min="0.5" max="60" step="0.5" style="width: 70px;">
    </div>

    <div class="setting-group">
      <label for="dither" title="How the GIF blends its limited color palette">Color blending</label>
      <select id="dither">
        <option value="bayer" selected>Sharp (Bayer)</option>
        <option value="floyd_steinberg">Smooth (Floyd-Steinberg)</option>
        <option value="sierra2">Balanced (Sierra)</option>
        <option value="none">None (flat colors)</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="maxColors">Colors:</label>
      <input type="range" id="maxColors" min="32" max="256" value="256" step="16">
      <span class="range-value" id="maxColorsValue">256</span>
    </div>

    <div class="setting-group">
      <label><input type="checkbox" id="reverseCheck"> Play in reverse</label>
    </div>

    <div class="setting-group">
      <label for="outputDirBtn">Save to</label>
      <button type="button" class="output-dir-btn" id="outputDirBtn" title="Choose where to save your results">
        Beside original files
      </button>
    </div>
  </div>

  <!-- Preview area -->
  <div class="gif-preview-area" id="previewArea">
    <div class="empty-state">
      Choose a video to start creating your GIF.
    </div>
  </div>

</div>

<!-- Bottom bar -->
<div class="tool-footer">
  <div class="tool-footer-left">
    <span class="status-text" id="statusText" role="status" aria-live="polite">Waiting for video</span>
    <div class="gif-footer-progress" id="footerProgress" role="progressbar" aria-label="GIF creation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-hidden="true">
      <div class="gif-footer-progress-fill" id="footerProgressFill"></div>
    </div>
    <span class="gif-progress-percent" id="progressPercent"></span>
    <div class="processing-indicator" id="processingIndicator">
      <div class="spinner"></div>
      <span>Creating GIF...</span>
    </div>
  </div>
  <div class="tool-footer-right">
    <button class="btn btn-clear" id="clearBtn">Clear all</button>
    <button class="btn btn-secondary" id="openOutputBtn" style="display:none;">Open folder</button>
    <button class="btn btn-primary" id="createBtn" disabled>Create GIF</button>
  </div>
</div>
