<!-- Tool body -->
<div class="tool-body">
  <div class="module-banner">
    <strong>Video Compressor.</strong> Reduce video file size by tuning quality, codec, preset, resolution, and two-pass encoding.
  </div>

  <!-- Drop zone -->
  <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-describedby="videoDropHint">
    <div class="drop-zone-icon">&#128230;</div>
    <div class="drop-zone-text">
      Drag &amp; drop video files to compress
    </div>
    <div class="drop-zone-actions">
      <button type="button" class="drop-zone-link" id="browseBtn">browse files</button>
      <span class="drop-zone-sep">|</span>
      <button type="button" class="drop-zone-link" id="browseFolderBtn">browse folder</button>
    </div>
    <div class="drop-zone-hint" id="videoDropHint">
      Supports: MP4, AVI, MKV, MOV, WebM
    </div>
  </div>

  <!-- Settings -->
  <div class="settings-bar" style="flex-wrap: wrap;">
    <div class="setting-group compression-goal-group">
      <label for="compressionGoal">Goal:</label>
      <select id="compressionGoal">
        <option value="quick">Quick share</option>
        <option value="balanced" selected>Balanced</option>
        <option value="smaller">Smallest file</option>
        <option value="quality">Best quality</option>
        <option value="custom">Custom</option>
      </select>
    </div>
    <div class="setting-group">
      <label for="crfSlider" title="Lower = better quality, bigger file">Quality level (CRF):</label>
      <input type="range" id="crfSlider" min="18" max="35" value="23">
      <span class="range-value" id="crfValue">23</span>
      <span class="range-hint">(lower = better)</span>
    </div>

    <div class="setting-group">
      <label for="preset">Encoding speed:</label>
      <select id="preset">
        <option value="ultrafast">Ultrafast</option>
        <option value="fast">Fast</option>
        <option value="medium" selected>Medium</option>
        <option value="slow">Slow</option>
        <option value="veryslow">Very Slow</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="codec">Compatibility:</label>
      <select id="codec">
        <option value="h264">H.264 (compatible)</option>
        <option value="h265">H.265 / HEVC (smaller)</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="resolution">Max resolution:</label>
      <select id="resolution">
        <option value="original">Original</option>
        <option value="1080p">1080p</option>
        <option value="720p">720p</option>
        <option value="480p">480p</option>
        <option value="custom">Custom width...</option>
      </select>
      <input type="number" id="customWidth" class="custom-width-input" placeholder="Width" min="128" max="7680" style="display:none; width: 80px; margin-left: 6px;">
    </div>

    <div class="setting-group">
      <label><input type="checkbox" id="twoPassCheck"> Two-pass</label>
    </div>

    <div class="setting-group">
      <label for="outputDirBtn">Output:</label>
      <button type="button" class="output-dir-btn" id="outputDirBtn" title="Click to select output directory">
        Same as source
      </button>
    </div>
  </div>

  <!-- File list -->
  <div class="file-list-container">
    <div class="file-list" id="fileList">
      <div class="empty-state">
        No files added yet. Drag video files above or click browse.
      </div>
    </div>
  </div>

</div>

<!-- Bottom bar -->
<div class="tool-footer">
  <div class="tool-footer-left">
    <span class="status-text" id="statusText" role="status" aria-live="polite">Waiting for Video</span>
    <div class="video-footer-progress" id="footerProgress" role="progressbar" aria-label="Video compression progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-hidden="true">
      <div class="video-footer-progress-fill" id="footerProgressFill"></div>
    </div>
    <span class="video-progress-percent" id="progressPercent"></span>
    <span class="eta-text" id="etaText"></span>
    <div class="processing-indicator" id="processingIndicator">
      <div class="spinner"></div>
      <span>Compressing...</span>
    </div>
  </div>
  <div class="tool-footer-right">
    <button class="btn btn-clear" id="clearBtn">Clear All</button>
    <button class="btn btn-secondary" id="retryBtn" style="display:none;">Retry Failed</button>
    <button class="btn btn-secondary" id="openOutputBtn" style="display:none;">Open Output</button>
    <button class="btn btn-primary" id="compressBtn" disabled>Compress</button>
  </div>
</div>
