<!-- Tool body -->
<div class="tool-body">
  <header class="tool-intro">
    <h2>Extract audio</h2>
    <p>Save the sound from your videos. Add files, choose an audio format, and extract.</p>
  </header>

  <!-- Drop zone -->
  <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-describedby="audioDropHint">
    <div class="drop-zone-icon">&#127925;</div>
    <div class="drop-zone-text">
      Drag &amp; drop video files to extract audio
    </div>
    <div class="drop-zone-actions">
      <button type="button" class="drop-zone-link" id="browseBtn">Choose files</button>
      <span class="drop-zone-sep">|</span>
      <button type="button" class="drop-zone-link" id="browseFolderBtn">Choose folder</button>
    </div>
    <div class="drop-zone-hint" id="audioDropHint">
      Supported files: MP4, AVI, MKV, MOV, WebM
    </div>
  </div>

  <!-- Settings -->
  <div class="settings-bar">
    <div class="setting-group">
      <label for="audioFormat">Format:</label>
      <select id="audioFormat">
        <option value="mp3">MP3</option>
        <option value="wav">WAV</option>
        <option value="flac">FLAC</option>
        <option value="aac">AAC</option>
        <option value="ogg">OGG</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="bitrate" title="Higher bitrates usually mean better sound and larger files">Audio bitrate</label>
      <select id="bitrate">
        <option value="128k">128 kbps</option>
        <option value="192k">192 kbps</option>
        <option value="256k" selected>256 kbps</option>
        <option value="320k">320 kbps</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="sampleRate">Sample rate</label>
      <select id="sampleRate">
        <option value="">Original</option>
        <option value="22050">22050 Hz</option>
        <option value="44100" selected>44100 Hz</option>
        <option value="48000">48000 Hz</option>
      </select>
    </div>

    <div class="setting-group">
      <label>
        <input type="checkbox" id="normalizeCheck"> Normalize volume
      </label>
    </div>

    <div class="setting-group">
      <label for="fadeIn">Fade in</label>
      <input type="number" id="fadeIn" value="0" min="0" max="30" step="0.5" style="width: 60px;"> <span class="range-hint">sec</span>
    </div>
    <div class="setting-group">
      <label for="fadeOut">Fade out</label>
      <input type="number" id="fadeOut" value="0" min="0" max="30" step="0.5" style="width: 60px;"> <span class="range-hint">sec</span>
    </div>

    <div class="setting-group">
      <label for="outputDirBtn">Save to</label>
      <button type="button" class="output-dir-btn" id="outputDirBtn" title="Choose where to save your results">
        Beside original files
      </button>
    </div>
  </div>

  <!-- File list -->
  <div class="file-list-container">
    <div class="file-list" id="fileList">
      <div class="empty-state">
        Your videos will appear here. Choose files or drop them above to begin.
      </div>
    </div>
  </div>

</div>

<!-- Bottom bar -->
<div class="tool-footer">
  <div class="tool-footer-left">
    <span class="status-text" id="statusText" role="status" aria-live="polite">Waiting for video</span>
    <div class="audio-footer-progress" id="footerProgress" role="progressbar" aria-label="Audio extraction progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-hidden="true">
      <div class="audio-footer-progress-fill" id="footerProgressFill"></div>
    </div>
    <span class="audio-progress-percent" id="progressPercent"></span>
    <span class="eta-text" id="etaText"></span>
    <div class="processing-indicator" id="processingIndicator">
      <div class="spinner"></div>
      <span>Extracting...</span>
    </div>
  </div>
  <div class="tool-footer-right">
    <button class="btn btn-clear" id="clearBtn">Clear all</button>
    <button class="btn btn-secondary" id="retryBtn" style="display:none;">Retry failed</button>
    <button class="btn btn-secondary" id="openOutputBtn" style="display:none;">Open folder</button>
    <button class="btn btn-primary" id="extractBtn" disabled>Extract audio</button>
  </div>
</div>
