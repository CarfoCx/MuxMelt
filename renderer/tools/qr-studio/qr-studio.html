<!-- Tool body -->
<div class="tool-body">
  <header class="tool-intro">
    <h2>Create a QR code</h2>
    <p>Share a link, text, Wi-Fi network, contact, or location. You can also read a QR code from an image.</p>
  </header>

  <!-- Generate panel (always visible) -->
  <div class="qr-generate-layout">
    <div class="qr-generate-form">
      <!-- Template selector tabs -->
      <div class="qr-template-tabs" role="tablist" aria-label="QR code type">
        <button type="button" class="qr-template-tab active" data-template="text" role="tab" aria-selected="true" aria-controls="tmplText">Text</button>
        <button type="button" class="qr-template-tab" data-template="url" role="tab" aria-selected="false" aria-controls="tmplUrl">Website</button>
        <button type="button" class="qr-template-tab" data-template="wifi" role="tab" aria-selected="false" aria-controls="tmplWifi">Wi-Fi</button>
        <button type="button" class="qr-template-tab" data-template="vcard" role="tab" aria-selected="false" aria-controls="tmplVcard">Contact</button>
        <button type="button" class="qr-template-tab" data-template="geo" role="tab" aria-selected="false" aria-controls="tmplGeo">Location</button>
      </div>

      <!-- Text template (default) -->
      <div class="qr-template-fields" id="tmplText" role="tabpanel">
        <div class="setting-group" style="flex-direction: column; align-items: flex-start; gap: 6px;">
          <label for="qrText">Text or link</label>
          <input type="text" id="qrText" placeholder="What would you like to share?" style="width: 100%;" autocomplete="off" spellcheck="false">
        </div>
      </div>

      <!-- URL template -->
      <div class="qr-template-fields" id="tmplUrl" role="tabpanel" style="display: none;">
        <div class="setting-group" style="flex-direction: column; align-items: flex-start; gap: 6px;">
          <label for="qrUrl">Website address</label>
          <div class="qr-url-input-wrap">
            <span class="qr-url-prefix">https://</span>
            <input type="text" id="qrUrl" placeholder="example.com/page" autocomplete="off" spellcheck="false">
          </div>
        </div>
      </div>

      <!-- WiFi template -->
      <div class="qr-template-fields" id="tmplWifi" role="tabpanel" style="display: none;">
        <div class="qr-template-grid">
          <div class="setting-group" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <label for="qrWifiSsid">Network name</label>
            <input type="text" id="qrWifiSsid" placeholder="MyNetwork" style="width: 100%;" autocomplete="off" spellcheck="false">
          </div>
          <div class="setting-group" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <label for="qrWifiPass">Password:</label>
            <input type="text" id="qrWifiPass" placeholder="Password" style="width: 100%;" autocomplete="off" spellcheck="false">
          </div>
          <div class="setting-group" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <label for="qrWifiSecurity">Security:</label>
            <select id="qrWifiSecurity" class="select-input" style="width: 100%;">
              <option value="WPA">WPA / WPA2</option>
              <option value="WEP">WEP</option>
              <option value="nopass">None</option>
            </select>
          </div>
        </div>
      </div>

      <!-- vCard template -->
      <div class="qr-template-fields" id="tmplVcard" role="tabpanel" style="display: none;">
        <div class="qr-template-grid">
          <div class="setting-group" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <label for="qrVcardName">Full Name:</label>
            <input type="text" id="qrVcardName" placeholder="John Doe" style="width: 100%;" autocomplete="off" spellcheck="false">
          </div>
          <div class="setting-group" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <label for="qrVcardPhone">Phone:</label>
            <input type="text" id="qrVcardPhone" placeholder="+1 555-123-4567" style="width: 100%;" autocomplete="off" spellcheck="false">
          </div>
          <div class="setting-group" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <label for="qrVcardEmail">Email:</label>
            <input type="text" id="qrVcardEmail" placeholder="john@example.com" style="width: 100%;" autocomplete="off" spellcheck="false">
          </div>
          <div class="setting-group" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <label for="qrVcardOrg">Organization:</label>
            <input type="text" id="qrVcardOrg" placeholder="Acme Inc." style="width: 100%;" autocomplete="off" spellcheck="false">
          </div>
        </div>
      </div>

      <!-- Geo template -->
      <div class="qr-template-fields" id="tmplGeo" role="tabpanel" style="display: none;">
        <div class="qr-template-grid qr-template-grid-2">
          <div class="setting-group" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <label for="qrGeoLat">Latitude:</label>
            <input type="text" id="qrGeoLat" placeholder="37.7749" style="width: 100%;">
          </div>
          <div class="setting-group" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <label for="qrGeoLon">Longitude:</label>
            <input type="text" id="qrGeoLon" placeholder="-122.4194" style="width: 100%;">
          </div>
        </div>
      </div>

      <div class="settings-bar qr-settings" style="flex-wrap: wrap; margin-top: 12px;">
        <div class="setting-group">
          <label for="qrSize">Size:</label>
          <input type="range" id="qrSize" min="128" max="1024" value="512" step="64">
          <span class="range-value" id="qrSizeValue">512px</span>
        </div>

        <div class="setting-group">
          <label for="qrColor">Foreground:</label>
          <input type="color" id="qrColor" value="#000000" class="color-input" title="Foreground color">
        </div>

        <div class="setting-group">
          <label for="qrBgColor">Background:</label>
          <input type="color" id="qrBgColor" value="#ffffff" class="color-input" title="Background color">
        </div>

        <div class="setting-group">
          <label for="qrMargin">Margin:</label>
          <input type="range" id="qrMargin" min="0" max="10" value="4" step="1">
          <span class="range-value" id="qrMarginValue">4</span>
        </div>

        <div class="setting-group">
          <label for="qrErrorCorrection" title="Higher levels help a QR code remain readable if part of it is damaged">Damage tolerance</label>
          <select id="qrErrorCorrection" class="select-input">
            <option value="L">Low (7%)</option>
            <option value="M" selected>Medium (15%)</option>
            <option value="Q">Higher (25%)</option>
            <option value="H">High (30%)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="qr-preview-box" id="qrPreviewBox">
      <div class="empty-state">QR code preview will appear here</div>
    </div>
  </div>

  <!-- Scan section (collapsible) -->
  <div class="qr-scan-section">
    <button type="button" class="qr-scan-toggle" id="scanToggle" aria-expanded="false" aria-controls="scanPanel">Scan existing QR code</button>
    <div class="qr-scan-panel" id="scanPanel" style="display: none;">
      <div class="drop-zone" id="scanDropZone" role="button" tabindex="0" aria-describedby="scanDropHint">
        <div class="drop-zone-icon">&#128269;</div>
        <div class="drop-zone-text">
          Drag &amp; drop an image containing a QR code
        </div>
        <div class="drop-zone-actions">
          <button type="button" class="drop-zone-link" id="scanBrowseBtn">Choose files</button>
        </div>
        <div class="drop-zone-hint" id="scanDropHint">
          Supported files: PNG, JPG, WebP, BMP
        </div>
      </div>

      <div class="qr-scan-result" id="scanResult" style="display: none;">
        <span id="decodedTextLabel">QR code content</span>
        <div class="qr-decoded-text" id="decodedText" role="textbox" aria-readonly="true" aria-labelledby="decodedTextLabel"></div>
        <button class="btn btn-secondary" id="copyResultBtn">Copy to Clipboard</button>
      </div>
    </div>
  </div>

</div>

<!-- Bottom bar -->
<div class="tool-footer">
  <div class="tool-footer-left">
    <span class="status-text" id="statusText" role="status" aria-live="polite">Waiting for input</span>
    <div class="processing-indicator" id="processingIndicator">
      <div class="spinner"></div>
      <span>Processing...</span>
    </div>
  </div>
  <div class="tool-footer-right">
    <button class="btn btn-clear" id="clearBtn">Clear all</button>
    <button class="btn btn-secondary" id="saveBtn" disabled>Save QR code</button>
    <button class="btn btn-primary" id="generateBtn">Create QR code</button>
  </div>
</div>
