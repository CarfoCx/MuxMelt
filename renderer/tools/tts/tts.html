<!-- Tool body -->
<div class="tool-body">
  <div class="module-banner">
    <strong>Offline Text to Speech.</strong> Uses voices installed on this computer. Your text stays on this device and is never sent to a speech service. System spellcheck is off unless you enable it for this session.
  </div>

  <!-- Text input area -->
  <div class="tts-input-area">
    <div class="tts-input-header">
      <label class="tts-label" for="ttsText">Text to Speech:</label>
      <label class="tts-spellcheck-toggle" title="Optional system/Chromium spellcheck; its language-service behavior depends on your operating system">
        <input type="checkbox" id="spellcheckToggle">
        <span>System Spellcheck (This Session)</span>
      </label>
    </div>
    <textarea id="ttsText" class="tts-textarea" placeholder="Enter the text you want to convert to speech..." rows="8" maxlength="50000" spellcheck="false"></textarea>
    <div class="tts-char-count"><span id="charCount">0</span> characters</div>
  </div>

  <!-- Settings -->
  <div class="settings-bar" style="flex-wrap: wrap;">
    <div class="setting-group">
      <label for="languageSelect">Language:</label>
      <select id="languageSelect">
        <option value="en">English</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="voiceSelect">Installed voice:</label>
      <select id="voiceSelect">
        <option value="">Select a language first</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="speedSlider">Speed:</label>
      <input type="range" id="speedSlider" min="0.5" max="2.0" value="1.0" step="0.1">
      <span class="range-value" id="speedValue">1.0x</span>
    </div>

    <div class="setting-group">
      <label for="pitchSlider">Tone:</label>
      <input type="range" id="pitchSlider" min="-12" max="12" value="0" step="1">
      <span class="range-value" id="pitchValue">0Hz</span>
    </div>

    <div class="setting-group">
      <label for="outputFormat">Format:</label>
      <select id="outputFormat">
        <option value="mp3">MP3</option>
        <option value="wav">WAV</option>
      </select>
    </div>

    <div class="setting-group">
      <label>Output:</label>
      <button class="output-dir-btn" id="outputDirBtn" title="Click to select output directory">
        Desktop (default)
      </button>
    </div>
  </div>

  <!-- Progress / result area -->
  <div class="tts-result-area" id="resultArea">
    <div class="empty-state">
      Enter text and click Preview or Generate.
    </div>
  </div>

</div>

<!-- Bottom bar -->
<div class="tool-footer">
  <div class="tool-footer-left">
    <span class="status-text" id="statusText">Waiting for Text</span>
    <div class="processing-indicator" id="processingIndicator">
      <div class="spinner"></div>
      <span>Generating...</span>
    </div>
  </div>
  <div class="tool-footer-right">
    <button class="btn btn-clear" id="clearBtn">Clear All</button>
    <button class="btn btn-secondary" id="openOutputBtn" style="display:none;">Open Output</button>
    <button class="btn btn-secondary" id="previewBtn">Preview</button>
    <button class="btn btn-primary" id="generateBtn">Generate</button>
  </div>
</div>
